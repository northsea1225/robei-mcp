[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robei-mcp"
version = "1.12.0"
description = "MCP server for Robei EDA: Verilog toolchain, project XML, and IDE automation over UIA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "robei", "eda", "verilog", "fpga", "icarus-verilog", "yosys"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "mcp==2.3.0",
  "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/northsea1225/robei-mcp"
Repository = "https://github.com/northsea1225/robei-mcp"
Issues = "https://github.com/northsea1225/robei-mcp/issues"
Changelog = "https://github.com/northsea1225/robei-mcp/blob/master/CHANGELOG.md"
Documentation = "https://github.com/northsea1225/robei-mcp/blob/master/docs/tool-reference.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = [
  "pywinauto>=0.6.9",
  "Pillow>=10",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
robei-mcp = "robei_mcp.__main__:main"

[tool.setuptools]
packages = ["robei_mcp", "robei_mcp.gui_agent"]

[tool.setuptools.package-data]
robei_mcp = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

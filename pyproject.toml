[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robei-mcp"
version = "1.2.1"
description = "MCP server for Robei EDA: Verilog toolchain, project XML, and IDE automation over UIA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp==2.3.0",
  "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/northsea1225/robei-mcp"
Changelog = "https://github.com/northsea1225/robei-mcp/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = [
  "pywinauto>=0.6.9",
  "Pillow>=10",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
robei-mcp = "robei_mcp.__main__:main"

[tool.setuptools]
packages = ["robei_mcp", "robei_mcp.gui_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  portable:
    name: portable test suite (ubuntu + iverilog + yosys)
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilog toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Versions
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          iverilog -V | head -2
          vvp -V | head -1
          yosys -V || true

      - name: Test suite (everything that needs neither Robei nor Windows)
        run: python -m pytest -q -m "not needs_robei and not needs_windows"

      - name: Human-readable summary
        run: python tests/portable_core.py

  wheel:
    name: wheel packaging guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: GUI driver, LICENSE and no leaked paths
        run: python tests/check_wheel.py dist

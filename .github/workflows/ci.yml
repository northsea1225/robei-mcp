name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  portable:
    name: portable core (ubuntu + iverilog)
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilog toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Versions
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          iverilog -V | head -2
          vvp -V | head -1
          yosys -V || true

      - name: Portable core (pytest, one case per subsystem)
        run: python -m pytest -q tests/test_portable.py

      - name: Human-readable summary
        run: python tests/portable_core.py

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  portable:
    name: portable core (ubuntu + iverilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilog toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Toolchain versions
        run: |
          iverilog -V | head -1
          vvp -V | head -1
          yosys -V || true

      - name: Portable core tests (no Robei, no GUI)
        run: python tests/portable_core.py

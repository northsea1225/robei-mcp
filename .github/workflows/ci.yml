name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  portable:
    name: portable core (ubuntu + iverilog)
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilog toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Versions
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          iverilog -V | head -2
          vvp -V | head -1
          yosys -V || true

      - name: simulate + waveform
        run: python tests/portable_core.py simulate

      - name: generate_testbench round trip
        run: python tests/portable_core.py testbench

      - name: Robei XML (read-only)
        run: python tests/portable_core.py robei-xml

      - name: headless experiment
        run: python tests/portable_core.py headless

      - name: lint (iverilog + yosys)
        run: python tests/portable_core.py lint
